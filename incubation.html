<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استيراد طلبات الاحتضان | Incubation Import</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">مُنشآت</span>
      <span class="brand-sub" data-i18n="incubationTitle">استيراد طلبات الاحتضان</span>
    </div>
    <nav class="top-nav">
      <a href="index.html" data-i18n="navConsultations">الاستشارات</a>
      <a href="events.html" data-i18n="navEvents">الفعاليات</a>
      <a href="incubation.html" class="active" data-i18n="navIncubation">الاحتضان</a>
    </nav>
    <button id="langToggle" class="lang-toggle" type="button">English</button>
  </header>

  <main class="app-main">
    <ol class="stepper" id="stepper">
      <li data-step="1" class="active"><span class="dot">1</span><span data-i18n="stepUpload">رفع الملف</span></li>
      <li data-step="2"><span class="dot">2</span><span data-i18n="stepReviewImport">المراجعة والاستيراد</span></li>
    </ol>

    <!-- STEP 1: upload -->
    <section class="step-panel" data-panel="1">
      <h2 data-i18n="uploadIncubationTitle">رفع ملف الطلبات (CSV)</h2>
      <p class="muted" data-i18n="uploadIncubationHint">ملف تصدير الطلبات.</p>
      <label class="file-drop">
        <input id="csvFile" type="file" accept=".csv,text/csv,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
        <span class="btn secondary" data-i18n="chooseFile">اختر ملفاً</span>
        <span id="csvFileName" class="muted" style="margin-inline-start:10px"></span>
      </label>
      <div id="csvParseInfo" class="muted" style="margin-top:12px"></div>
    </section>

    <!-- STEP 2: preview + confirm -->
    <section class="step-panel hidden" data-panel="2">
      <h2 data-i18n="previewIncubationTitle">معاينة قبل الاستيراد</h2>
      <div id="previewTotals" class="totals-grid"></div>
      <div id="previewToolbar" class="preview-toolbar hidden">
        <input id="rowSearch" type="search" data-i18n-ph="searchIncPlaceholder" placeholder="ابحث..." autocomplete="off" />
        <label class="selall"><input type="checkbox" id="selAll" /> <span data-i18n="selectAll">تحديد الكل</span></label>
        <span id="selCount" class="muted"></span>
      </div>
      <div id="previewArea" style="margin-top:14px"></div>
      <div id="importReport" class="review hidden" style="margin-top:14px"></div>
    </section>

    <div class="wizard-nav">
      <button type="button" class="btn ghost" id="backBtn" data-i18n="back">رجوع</button>
      <button type="button" class="btn" id="nextBtn" data-i18n="next">التالي</button>
      <button type="button" class="btn" id="confirmBtn" data-i18n="confirmImport" hidden>تأكيد الاستيراد</button>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="assertive"></div>
  </main>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="csv.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="validate.js"></script>
  <script src="incubationBuild.js"></script>
  <script src="incubation.js"></script>
</body>
</html>
